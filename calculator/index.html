<!DOCTYPE html>
<html>

<head>
    <title>Calculator</title>
</head>

<link rel="stylesheet" href="style.css">

<body>
    <p class="js-calculations calculations"></p>
    <p>
        <button class="grey-button" onclick="
        updateCalculation('1');
      ">1</button>

        <button class="grey-button" onclick="
        updateCalculation('2');
      ">2</button>

        <button class="grey-button" onclick="
        updateCalculation('3');
      ">3</button>

        <button class="orange-button" onclick="
        updateCalculation(' + ');
      ">+</button>
    </p>

    <p>
        <button class="grey-button" onclick="
        updateCalculation('4');
      ">4</button>

        <button class="grey-button" onclick="
        updateCalculation('5');
      ">5</button>

        <button class="grey-button" onclick="
        updateCalculation('6');
      ">6</button>

        <button class="orange-button" onclick="
        updateCalculation(' - ');
      ">-</button>
    </p>

    <p>
        <button class="grey-button" onclick="
        updateCalculation('7');
      ">7</button>

        <button class="grey-button" onclick="
        updateCalculation('8');
      ">8</button>

        <button class="grey-button" onclick="
        updateCalculation('9');
      ">9</button>

        <button class="orange-button" onclick="
        updateCalculation(' * ');
      ">*</button>
    </p>

    <p>
        <button class="grey-button" onclick="
        updateCalculation('0');
      ">0</button>

        <button class="grey-button" onclick="
        updateCalculation('.');
      ">.</button>

        <button class="grey-button" onclick="
        calculation = eval(calculation);
        let calc = localStorage.setItem('calculations',JSON.stringify(calculation))
        document.querySelector('.js-calculations').innerHTML = calculation;
        console.log(calculation);
      ">=</button>

        <button class="orange-button" onclick="
        updateCalculation(' / ');
      ">/</button>
    </p>

    <p>
        <button class="clear-button" onclick="
        calculation = '';
        document.querySelector('.js-calculations').innerHTML = calculation;
        console.log(calculation);
      ">Clear</button>
    </p>

    <script src="script.js"></script>
</body>

</html>
