<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Choice Picker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="box">
        <div class="container">
            <p>Enter all the choices seperated by a comma(',').</p>
            <p>Press enter when you are done!</p>
            <textarea placeholder="Enter your choices" class="text"></textarea>
            <p class="input"></p>
            <p class="output"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
